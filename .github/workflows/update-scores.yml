name: Update Tunneling Scores

on:
  schedule:
    # Runs every Monday at 8am UTC (3am ET) during MLB season
    - cron: '0 8 * * 1'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e '
            install.packages(c(
              "dplyr", "readr", "httr", "lubridate",
              "tidyr", "data.table", "xgboost"
            ))
          '

      - name: Pull latest Statcast data
        run: Rscript 01_pull_statcast.R

      - name: Compute tunneling metrics
        run: Rscript 02_compute_tunneling.R

      - name: Calculate Tunneling+ and tWAA
        run: Rscript 03_score_and_export.R

      - name: Commit and push updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.csv pitch_type_tunneling_scores.csv pitch_pair_xrv_matrix.csv pitcher_pitch_pair_combos_all.csv top_100_tunnelers.csv model_metadata.txt last_updated.txt
          git diff --staged --quiet || git commit -m "Auto-update tunneling scores $(date +'%Y-%m-%d')"
          git push
